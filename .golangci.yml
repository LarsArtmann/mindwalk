version: "2"
run:
  timeout: 5m
  go: 1.26.5
  build-tags:
    - goexperiment.arenas
    - goexperiment.goroutineleakprofile
    - goexperiment.jsonv2
    - goexperiment.runtimesecret
    - goexperiment.simd
  allow-parallel-runners: true
  allow-serial-runners: true
  issues-exit-code: 1
output:
  formats: {}
linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - nilerr
    - nilnesserr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*sql.DB).Close
        - (*sql.Rows).Close
        - (*sql.Stmt).Close
        - (net.Conn).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).WriteString
    gocritic:
      disabled-checks:
        - ifElseChain
    gomoddirectives:
      replace-local: true
    gosec:
      excludes:
        - G104 # unchecked errors (errcheck handles this)
        - G114 # http.Serve without timeout (local dev server)
        - G115 # integer overflow (false positives)
        - G204 # subprocess with variable (local tool, intentional)
        - G301 # directory permissions 0755 (standard for local tool)
        - G304 # file path from variable (local tool, user-controlled)
        - G306 # file write permissions 0o644 (user-readable output files)
        - G602 # slice index out of range (false positives, bounds-checked)
        - G703 # path traversal (local tool, user controls output)
        - G705 # XSS via taint (SSE data is JSON-marshaled)
    testifylint:
      disable:
        - go-require
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errchkjson
          - gosec
          - nilerr
          - rowserrcheck
          - sqlclosecheck
          - forcetypeassert
      # WalkDir callbacks intentionally swallow walk errors to continue traversal.
      - text: "error is not nil"
        linters:
          - nilerr
      # ListSessions returns (nil, nil) when the session directory is missing —
      # callers treat an empty slice the same as an error.
      - text: "return both a `nil` error"
        linters:
          - nilnil
    paths:
      - \.gen\.go$
      - _templ\.go$
      - vendor/
formatters:
  enable:
    - gci
    - goimports
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - _templ\.go$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
